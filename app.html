<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>플라워랜드 앱 설치</title>
<script>
(function(){
  var PLAY="https://play.google.com/store/apps/details?id=flowerland.app";
  var IOS="https://apps.apple.com/kr/app/id6811226532";
  var ua=navigator.userAgent||"";
  var isIOS=/iPhone|iPad|iPod/i.test(ua)||(/Macintosh/.test(ua)&&navigator.maxTouchPoints>1);
  if(/Android/i.test(ua)){location.replace(PLAY);}
  else if(isIOS){location.replace(IOS);}
})();
</script>
<style>
body{margin:0;font-family:-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;background:#2E2E2C;color:#fff;text-align:center}
.wrap{max-width:420px;margin:0 auto;padding:56px 20px}
h1{font-size:26px;margin:0 0 8px}
p{color:#C8E6C9;margin:0 0 28px;line-height:1.6}
a.btn{display:block;margin:12px 0;padding:16px;border-radius:14px;font-size:18px;font-weight:700;text-decoration:none;color:#1B3A2A;background:linear-gradient(90deg,#EAEFC5,#C7E8D4,#C0DDEC)}
a.web{background:none;border:1px solid #6b6b68;color:#ddd;font-weight:500}
</style>
</head>
<body>
<div class="wrap">
  <h1>🌼 플라워랜드</h1>
  <p>불로화훼단지 식물 추천 앱<br>휴대폰에 맞는 스토어로 이동합니다.</p>
  <a class="btn" href="https://play.google.com/store/apps/details?id=flowerland.app">▶ 안드로이드 · Google Play</a>
  <a class="btn" href="https://apps.apple.com/kr/app/id6811226532"> 아이폰 · App Store</a>
  <a class="btn web" href="https://flowerland-bullo.streamlit.app">설치 없이 웹으로 보기</a>
</div>
</body>
</html>
